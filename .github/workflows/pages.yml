name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Pages Upload API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" || -z "$CF_PROJECT" ]]; then
            echo "::warning::Set secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID and variable CF_PAGES_PROJECT."
            exit 0
          fi
          tar --exclude=.git --exclude=.github -czf /tmp/site.tgz .
          curl -sS --fail-with-body \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PROJECT}/deployments" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "file=@/tmp/site.tgz" \
            | tee /tmp/pages-deploy.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/pages-deploy.json'))
          r = d.get('result', {})
          print('deployment:', r.get('id'), '| url:', r.get('url'), '| stage:', (r.get('stages') or [{}])[-1].get('name'))
          PY